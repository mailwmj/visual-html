<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual HTML — 设计风格全量画廊 (Style Gallery)</title>
  <style>
    :root {
      --bg: #0C0F14;
      --surface-1: #141A23;
      --surface-2: #1D2533;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
      --text-pri: #F8FAFC;
      --text-sec: #94A3B8;
      --text-mut: #64748B;
      --accent: #38BDF8;
      --accent-hover: #0EA5E9;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --radius: 16px;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, Courier New, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56, 189, 248, 0.12), transparent 70%),
        radial-gradient(circle 600px at 90% 80%, rgba(168, 85, 247, 0.08), transparent 60%);
      background-attachment: fixed;
      color: var(--text-pri);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      padding: 48px 24px 100px;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    h1 {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.lead {
      color: var(--text-sec);
      font-size: 17px;
      line-height: 1.65;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
    }
    .filter-btn {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 400;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-sec);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      border-color: rgba(255, 255, 255, 0.16);
      color: var(--text-pri);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }
    .filter-btn.active {
      background: rgba(56, 189, 248, 0.12);
      color: #7DD3FC;
      border-color: rgba(56, 189, 248, 0.35);
      font-weight: 500;
    }

    /* Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }
    .gallery-error {
      grid-column: 1 / -1;
      margin: 0;
      padding: 20px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: var(--radius);
      background: rgba(127, 29, 29, 0.18);
      color: #FCA5A5;
    }

    /* Style Card */
    .style-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }
    .style-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .card-preview {
      width: 100%;
      background: transparent;
      aspect-ratio: 400 / 240;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .style-card:hover .card-preview img {
      transform: scale(1.02);
    }
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .btn-use {
      grid-column: span 2;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 9px 16px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: #7DD3FC;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-use:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.45);
      color: #F0F9FF;
      transform: translateY(-1px);
    }
    .btn-use:active {
      transform: translateY(0);
      background: rgba(56, 189, 248, 0.22);
    }
    .btn-link {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      padding: 7px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-sec);
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-link:hover {
      color: var(--text-pri);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }
    .btn-link:active {
      transform: translateY(0);
    }

    .btn-use.copy-success {
      background: rgba(16, 185, 129, 0.15) !important;
      border-color: rgba(16, 185, 129, 0.4) !important;
      color: #6EE7B7 !important;
      box-shadow: none !important;
      animation: none;
    }
    .btn-use.copy-failure {
      background: rgba(244, 63, 94, 0.15) !important;
      border-color: rgba(244, 63, 94, 0.4) !important;
      color: #FDA4AF !important;
    }
    @keyframes copy-confirm {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      25% { box-shadow: 0 0 0 5px var(--accent-glow), 0 0 24px rgba(56, 189, 248, 0.3); }
      100% { box-shadow: 0 0 0 3px var(--accent-glow), 0 0 18px var(--accent-glow); }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    body.is-previewing {
      padding: 0;
      overflow: hidden;
      background-image: none;
    }
    .preview-view {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
    }
    .preview-view[hidden] { display: none; }
    .preview-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #FFFFFF;
    }

    /* Floating Left-Top Discrete Squircles (Option A) */
    .floating-actions {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(12, 15, 20, 0.72);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      padding: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .action-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(12, 15, 20, 0.9);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .action-btn:active {
      transform: translateY(0);
    }
    .action-btn-back {
      color: var(--text-sec);
    }
    .action-btn-back:hover {
      color: #F8FAFC;
    }
    .action-btn-back:hover .action-svg {
      transform: translateX(-1.5px);
    }
    .action-svg {
      display: block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .action-btn-use {
      color: #7DD3FC;
      background: rgba(14, 165, 233, 0.12);
      border-color: rgba(56, 189, 248, 0.28);
    }
    .action-btn-use:hover {
      color: #F0F9FF;
      background: rgba(56, 189, 248, 0.22);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .action-icon-check {
      display: none;
    }
    .action-btn-use.copy-success {
      color: #6EE7B7 !important;
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: rgba(16, 185, 129, 0.5) !important;
    }
    .action-btn-use.copy-success .action-icon-copy {
      display: none;
    }
    .action-btn-use.copy-success .action-icon-check {
      display: block;
    }
    .action-btn-use.copy-failure {
      color: #FDA4AF !important;
      background: rgba(244, 63, 94, 0.2) !important;
      border-color: rgba(244, 63, 94, 0.5) !important;
    }

    @media (max-width: 860px) {
      .gallery-grid { grid-template-columns: 1fr; }
      body { padding: 32px 16px 72px; }
      header { margin-bottom: 32px; }
      .floating-actions { top: 12px; left: 12px; gap: 6px; }
      .action-btn { width: 32px; height: 32px; border-radius: 7px; }
    }
  </style>
</head>
<body>

  <main class="wrap" id="gallery-view">
    <header>
      <div class="eyebrow">
        <span class="dot"></span>
        VISUAL HTML STYLE PACKS // 3.0
      </div>
      <h1>设计风格全量画廊</h1>
      <p class="lead">已内置 <span id="style-count">0</span> 套独立演进的可插拔设计系统。先查看风格预览；点击“使用此风格”即可复制选择文本，粘贴到对话后继续。</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">全部风格 (0)</button>
      <button class="filter-btn" data-filter="tech">硬核科技 / 参数展示</button>
      <button class="filter-btn" data-filter="pop">潮流创意 / 像素波普</button>
      <button class="filter-btn" data-filter="editorial">人文社论 / 智识工作流</button>
      <button class="filter-btn" data-filter="lifestyle">清新雅致 / 生活方式</button>
    </div>

    <!-- Cards are generated from styles/registry.json. -->
    <div class="gallery-grid" id="grid" aria-live="polite"></div>
  </main>

  <section class="preview-view" id="preview-view" hidden aria-label="风格示例预览">
    <div class="floating-actions" aria-label="示例预览导航">
      <button class="action-btn action-btn-back" id="preview-back" type="button" title="返回画廊" aria-label="返回画廊">
        <svg class="action-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <button class="action-btn action-btn-use" id="preview-use" type="button" title="使用此风格 (复制提示词)" aria-label="使用此风格">
        <svg class="action-svg action-icon-copy" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <svg class="action-svg action-icon-check" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
    <iframe class="preview-frame" id="preview-frame" title="风格示例预览"></iframe>
  </section>

  <p id="copy-status" class="sr-only" aria-live="polite"></p>

  <script>
    function selectionPrompt(styleId, styleName) {
      return `我选择了视觉风格“${styleName}”（style_id: ${styleId}）。`;
    }

    const copyFeedbackTimers = new WeakMap();

    function showCopyFeedback(button, label, state) {
      window.clearTimeout(copyFeedbackTimers.get(button));
      button.classList.remove('copy-success', 'copy-failure');
      button.classList.add(state);
      const isIconOnly = button.classList.contains('action-btn') || button.classList.contains('dock-btn');
      if (isIconOnly) {
        button.setAttribute('title', label);
        button.setAttribute('aria-label', label);
      } else {
        button.textContent = label;
      }
      document.getElementById('copy-status').textContent = label;
      copyFeedbackTimers.set(button, window.setTimeout(() => {
        button.classList.remove('copy-success', 'copy-failure');
        if (isIconOnly) {
          button.setAttribute('title', '使用此风格 (复制提示词)');
          button.setAttribute('aria-label', '使用此风格');
        } else {
          button.textContent = '使用此风格';
        }
      }, 1900));
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      textarea.remove();
      if (!copied) throw new Error('当前浏览器禁止访问剪贴板');
    }

    async function copyStyleSelection(styleId, styleName, button) {
      try {
        await copyText(selectionPrompt(styleId, styleName));
        showCopyFeedback(button, '✓ 风格已复制', 'copy-success');
      } catch (error) {
        showCopyFeedback(button, '复制失败', 'copy-failure');
      }
    }

    // Gallery and filtering setup

    const galleryView = document.getElementById('gallery-view');
    const previewView = document.getElementById('preview-view');
    const previewFrame = document.getElementById('preview-frame');
    const previewBack = document.getElementById('preview-back');
    const previewUse = document.getElementById('preview-use');
    const galleryGrid = document.getElementById('grid');
    const styleCount = document.getElementById('style-count');
    const baseTitle = document.title;
    const galleryStateKey = 'visual-html-gallery-state';
    let activeFilter = 'all';
    let currentPreviewRoute = null;
    let registeredStyles = [];

    function createPreviewLink(label, href) {
      const link = document.createElement('a');
      link.className = 'btn-link';
      link.href = href;
      link.textContent = label;
      link.addEventListener('click', event => {
        event.preventDefault();
        openPreview(link);
      });
      return link;
    }

    function createStyleCard(style) {
      const card = document.createElement('article');
      card.className = 'style-card';
      card.dataset.styleId = style.id;
      card.dataset.styleName = style.name;
      card.dataset.category = style.categories.join(' ');

      const preview = document.createElement('div');
      preview.className = 'card-preview';
      const image = document.createElement('img');
      image.src = `styles/${encodeURIComponent(style.dir)}/preview.png`;
      image.alt = `${style.id} preview`;
      image.loading = 'lazy';
      preview.appendChild(image);

      const body = document.createElement('div');
      body.className = 'card-body';
      const actions = document.createElement('div');
      actions.className = 'card-actions';
      const useButton = document.createElement('button');
      useButton.type = 'button';
      useButton.className = 'btn-use';
      useButton.textContent = '使用此风格';
      useButton.addEventListener('click', () => copyStyleSelection(style.id, style.name, useButton));
      actions.append(
        useButton,
        createPreviewLink('查看网页 Demo', `styles/${encodeURIComponent(style.dir)}/scaffold-web.html`),
        createPreviewLink('查看 PPT 模版', `styles/${encodeURIComponent(style.dir)}/scaffold-ppt.html`)
      );
      body.appendChild(actions);
      card.append(preview, body);
      return card;
    }

    function renderStyleCards(styles) {
      registeredStyles = styles;
      const fragment = document.createDocumentFragment();
      styles.forEach(style => fragment.appendChild(createStyleCard(style)));
      galleryGrid.replaceChildren(fragment);
      styleCount.textContent = String(styles.length);
      document.querySelector('.filter-btn[data-filter="all"]').textContent = `全部风格 (${styles.length})`;
    }

    function showRegistryError() {
      const message = document.createElement('p');
      message.className = 'gallery-error';
      message.textContent = '无法加载风格注册表。请通过 Visual HTML 本地画廊服务打开此页面。';
      galleryGrid.replaceChildren(message);
    }

    async function loadStyleRegistry() {
      const registryUrl = new URL('styles/registry.json', window.location.href);
      const response = await fetch(registryUrl, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Registry request failed: ${response.status}`);
      const payload = await response.json();
      const styles = Array.isArray(payload?.styles) ? payload.styles : [];
      const validStyles = styles.filter(style =>
        style && typeof style.id === 'string' && typeof style.name === 'string' &&
        typeof style.dir === 'string' && Array.isArray(style.categories)
      );
      if (!validStyles.length) throw new Error('Registry contains no valid styles');
      renderStyleCards(validStyles);
    }

    function setGalleryFilter(filter) {
      const selectedButton = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
      if (!selectedButton) filter = 'all';
      activeFilter = filter;

      document.querySelectorAll('.filter-btn').forEach(button => {
        button.classList.toggle('active', button.getAttribute('data-filter') === activeFilter);
      });
      document.querySelectorAll('.style-card').forEach(card => {
        const categories = card.getAttribute('data-category') || '';
        card.style.display = activeFilter === 'all' || categories.includes(activeFilter) ? 'flex' : 'none';
      });
    }

    function saveGalleryState() {
      sessionStorage.setItem(galleryStateKey, JSON.stringify({ filter: activeFilter, scrollY: window.scrollY }));
    }

    function restoreGalleryState() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(galleryStateKey) || 'null');
        if (!saved) return;
        setGalleryFilter(saved.filter);
        window.requestAnimationFrame(() => window.scrollTo(0, Number(saved.scrollY) || 0));
      } catch {
        setGalleryFilter('all');
      }
    }

    function galleryUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('preview');
      url.searchParams.delete('format');
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function previewUrl(styleId, format) {
      const url = new URL(window.location.href);
      url.searchParams.set('preview', styleId);
      url.searchParams.set('format', format);
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function previewRoute() {
      const url = new URL(window.location.href);
      const styleId = url.searchParams.get('preview');
      const format = url.searchParams.get('format');
      const style = registeredStyles.find(item => item.id === styleId);
      if (!style || !['web', 'ppt'].includes(format)) return null;
      return {
        styleId,
        styleName: style.name,
        format,
        href: `styles/${style.dir}/scaffold-${format}.html`
      };
    }

    function showPreview(route) {
      currentPreviewRoute = route;
      const formatLabel = route.format === 'web' ? '网页 Demo' : 'PPT 模版';
      galleryView.hidden = true;
      previewView.hidden = false;
      document.body.classList.add('is-previewing');
      previewFrame.title = `${route.styleName} · ${formatLabel}`;
      previewFrame.src = route.href;
      document.title = `${route.styleName} · ${formatLabel} — Visual HTML`;
    }

    function showGallery({ restore = false } = {}) {
      currentPreviewRoute = null;
      previewFrame.removeAttribute('src');
      previewView.hidden = true;
      galleryView.hidden = false;
      document.body.classList.remove('is-previewing');
      document.title = baseTitle;
      if (restore) restoreGalleryState();
    }

    function openPreview(link) {
      const card = link.closest('.style-card');
      const styleId = card?.getAttribute('data-style-id');
      const styleName = card?.getAttribute('data-style-name');
      const format = link.href.includes('scaffold-ppt.html') ? 'ppt' : 'web';
      if (!styleId || !styleName) return;
      saveGalleryState();
      history.pushState({ visualHtmlView: 'preview' }, '', previewUrl(styleId, format));
      showPreview({ styleId, styleName, format, href: link.getAttribute('href') });
    }

    document.querySelectorAll('.filter-btn').forEach(button => {
      button.addEventListener('click', () => setGalleryFilter(button.getAttribute('data-filter') || 'all'));
    });

    previewBack.addEventListener('click', () => {
      history.replaceState({ visualHtmlView: 'gallery' }, '', galleryUrl());
      showGallery({ restore: true });
    });

    if (previewUse) {
      previewUse.addEventListener('click', () => {
        if (!currentPreviewRoute) return;
        copyStyleSelection(currentPreviewRoute.styleId, currentPreviewRoute.styleName, previewUse);
      });
    }

    window.addEventListener('popstate', () => {
      const route = previewRoute();
      if (route) showPreview(route);
      else showGallery({ restore: true });
    });

    async function initializeGallery() {
      try {
        await loadStyleRegistry();
        const initialRoute = previewRoute();
        if (initialRoute) {
          history.replaceState({ visualHtmlView: 'preview' }, '', window.location.href);
          showPreview(initialRoute);
        } else {
          setGalleryFilter('all');
        }
      } catch (error) {
        console.error(error);
        showRegistryError();
      }
    }

    void initializeGallery();
  </script>
</body>
</html>
