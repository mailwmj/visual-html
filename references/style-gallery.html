  <style>
    :root {
      --bg: #0C0F14;
      --surface-1: #141A23;
      --surface-2: #1D2533;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
      --text-pri: #F1F5F9;
      --text-sec: #94A3B8;
      --text-mut: #64748B;
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --radius: 16px;
      --font-sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      --font-mono: "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(56, 189, 248, 0.12), transparent 70%),
        radial-gradient(circle 600px at 90% 80%, rgba(168, 85, 247, 0.08), transparent 60%);
      background-attachment: fixed;
      color: var(--text-pri);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      padding: 48px 24px 100px;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    h1 {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.lead {
      color: var(--text-sec);
      font-size: 17px;
      line-height: 1.65;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
    }
    .filter-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      color: var(--text-sec);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text-pri);
      transform: translateY(-1px);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #0C0F14;
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    /* Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }

    /* Style Card */
    .style-card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }
    .style-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4), 0 0 24px var(--accent-glow);
    }
    .card-preview {
      width: 100%;
      background: transparent;
      aspect-ratio: 400 / 240;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .style-card:hover .card-preview img {
      transform: scale(1.02);
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .style-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .style-name {
      color: var(--text-pri);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
    }
    .style-id {
      color: var(--text-mut);
      font-family: var(--font-mono);
      font-size: 11px;
      white-space: nowrap;
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .btn-use {
      grid-column: span 2;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #0C0F14;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-use:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-link {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-sec);
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn-link:hover {
      color: var(--text-pri);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .btn-use.copy-success {
      background: var(--surface-1);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), 0 0 18px var(--accent-glow);
      animation: copy-confirm 1.9s ease-out;
    }
    .btn-use.copy-failure {
      background: #3A121E;
      border-color: #FB7185;
      color: #FDA4AF;
    }
    @keyframes copy-confirm {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      25% { box-shadow: 0 0 0 5px var(--accent-glow), 0 0 24px rgba(56, 189, 248, 0.3); }
      100% { box-shadow: 0 0 0 3px var(--accent-glow), 0 0 18px var(--accent-glow); }
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    body.is-previewing {
      padding: 0;
      overflow: hidden;
      background-image: none;
    }
    .preview-view {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      grid-template-rows: 68px minmax(0, 1fr);
      background: var(--bg);
    }
    .preview-view[hidden] { display: none; }
    .preview-nav {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 15, 20, 0.96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
    }
    .preview-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(56, 189, 248, 0.36);
      border-radius: 6px;
      background: var(--surface-1);
      color: var(--text-pri);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .preview-back:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
    }
    .preview-back-icon {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 16px;
      line-height: 1;
    }
    .preview-context {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
      overflow: hidden;
    }
    .preview-name {
      overflow: hidden;
      color: var(--text-pri);
      font-size: 15px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-id,
    .preview-format {
      flex: 0 0 auto;
      color: var(--text-mut);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
    }
    .preview-format {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--accent);
      background: var(--accent-glow);
    }
    .preview-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #FFFFFF;
    }

    @media (max-width: 860px) {
      .gallery-grid { grid-template-columns: 1fr; }
      body { padding: 32px 16px 72px; }
      header { margin-bottom: 32px; }
      .preview-view { grid-template-rows: 58px minmax(0, 1fr); }
      .preview-nav { gap: 12px; padding: 0 12px; }
      .preview-back { padding: 0 9px; font-size: 13px; }
      .preview-id { display: none; }
      .preview-name { font-size: 14px; }
      .preview-format { font-size: 10px; }
    }
  </style>

    <iframe class="preview-frame" id="preview-frame" title="风格示例预览"></iframe>
  </section>

  <p id="copy-status" class="sr-only" aria-live="polite"></p>

  <script>
    function selectionPrompt(styleId, styleName) {
      return `我选择了视觉风格“${styleName}”（style_id: ${styleId}）。`;
    }

    const copyFeedbackTimers = new WeakMap();

    function showCopyFeedback(button, label, state) {
      window.clearTimeout(copyFeedbackTimers.get(button));
      button.classList.remove('copy-success', 'copy-failure');
      button.classList.add(state);
      button.textContent = label;
      document.getElementById('copy-status').textContent = label;
      copyFeedbackTimers.set(button, window.setTimeout(() => {
        button.classList.remove('copy-success', 'copy-failure');
        button.textContent = '使用此风格';
      }, 1900));
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      textarea.remove();
      if (!copied) throw new Error('当前浏览器禁止访问剪贴板');
    }

    async function copyStyleSelection(styleId, styleName, button) {
      try {
        await copyText(selectionPrompt(styleId, styleName));
        showCopyFeedback(button, '✓ 风格已复制', 'copy-success');
      } catch (error) {
        showCopyFeedback(button, '复制失败', 'copy-failure');
      }
    }

    // Filter functionality
    document.querySelectorAll('.style-card').forEach(card => {
      const body = card.querySelector('.card-body');
      if (!body) return;
      const label = document.createElement('div');
      label.className = 'style-label';
      const name = document.createElement('span');
      name.className = 'style-name';
      name.textContent = card.getAttribute('data-style-name') || card.getAttribute('data-style-id') || '';
      const id = document.createElement('span');
      id.className = 'style-id';
      id.textContent = card.getAttribute('data-style-id') || '';
      label.append(name, id);
      body.prepend(label);
    });

    const galleryView = document.getElementById('gallery-view');
    const previewView = document.getElementById('preview-view');
    const previewFrame = document.getElementById('preview-frame');
    const previewName = document.getElementById('preview-name');
    const previewId = document.getElementById('preview-id');
    const previewFormat = document.getElementById('preview-format');
    const previewBack = document.getElementById('preview-back');
    const baseTitle = document.title;
    const galleryStateKey = 'visual-html-gallery-state';
    let activeFilter = 'all';

    function setGalleryFilter(filter) {
      const selectedButton = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
      if (!selectedButton) filter = 'all';
      activeFilter = filter;

      document.querySelectorAll('.filter-btn').forEach(button => {
        button.classList.toggle('active', button.getAttribute('data-filter') === activeFilter);
      });
      document.querySelectorAll('.style-card').forEach(card => {
        const categories = card.getAttribute('data-category') || '';
        card.style.display = activeFilter === 'all' || categories.includes(activeFilter) ? 'flex' : 'none';
      });
    }

    function saveGalleryState() {
      sessionStorage.setItem(galleryStateKey, JSON.stringify({ filter: activeFilter, scrollY: window.scrollY }));
    }

    function restoreGalleryState() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(galleryStateKey) || 'null');
        if (!saved) return;
        setGalleryFilter(saved.filter);
        window.requestAnimationFrame(() => window.scrollTo(0, Number(saved.scrollY) || 0));
      } catch {
        setGalleryFilter('all');
      }
    }

    function galleryUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete('preview');
      url.searchParams.delete('format');
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function previewUrl(styleId, format) {
      const url = new URL(window.location.href);
      url.searchParams.set('preview', styleId);
      url.searchParams.set('format', format);
      return `${url.pathname}${url.search}${url.hash}`;
    }

    function previewRoute() {
      const url = new URL(window.location.href);
      const styleId = url.searchParams.get('preview');
      const format = url.searchParams.get('format');
      const card = Array.from(document.querySelectorAll('.style-card')).find(item => item.getAttribute('data-style-id') === styleId);
      if (!card || !['web', 'ppt'].includes(format)) return null;
      return {
        styleId,
        styleName: card.getAttribute('data-style-name') || styleId,
        format,
        href: `styles/${styleId}/scaffold-${format}.html`
      };
    }

    function showPreview(route) {
      const formatLabel = route.format === 'web' ? '网页示例' : 'PPT 示例';
      galleryView.hidden = true;
      previewView.hidden = false;
      document.body.classList.add('is-previewing');
      previewName.textContent = route.styleName;
      previewId.textContent = route.styleId;
      previewFormat.textContent = formatLabel;
      previewFrame.title = `${route.styleName} ${formatLabel}`;
      previewFrame.src = route.href;
      document.title = `${route.styleName} · ${formatLabel} — Visual HTML`;
    }

    function showGallery({ restore = false } = {}) {
      previewFrame.removeAttribute('src');
      previewView.hidden = true;
      galleryView.hidden = false;
      document.body.classList.remove('is-previewing');
      document.title = baseTitle;
      if (restore) restoreGalleryState();
    }

    function openPreview(link) {
      const card = link.closest('.style-card');
      const styleId = card?.getAttribute('data-style-id');
      const styleName = card?.getAttribute('data-style-name');
      const format = link.href.includes('scaffold-ppt.html') ? 'ppt' : 'web';
      if (!styleId || !styleName) return;
      saveGalleryState();
      history.pushState({ visualHtmlView: 'preview' }, '', previewUrl(styleId, format));
      showPreview({ styleId, styleName, format, href: link.getAttribute('href') });
    }

    document.querySelectorAll('.filter-btn').forEach(button => {
      button.addEventListener('click', () => setGalleryFilter(button.getAttribute('data-filter') || 'all'));
    });

    document.querySelectorAll('.btn-link').forEach(link => {
      link.addEventListener('click', event => {
        event.preventDefault();
        openPreview(link);
      });
    });

    previewBack.addEventListener('click', () => {
      history.replaceState({ visualHtmlView: 'gallery' }, '', galleryUrl());
      showGallery({ restore: true });
    });

    window.addEventListener('popstate', () => {
      const route = previewRoute();
      if (route) showPreview(route);
      else showGallery({ restore: true });
    });

    const initialRoute = previewRoute();
    if (initialRoute) {
      history.replaceState({ visualHtmlView: 'preview' }, '', window.location.href);
      showPreview(initialRoute);
    } else {
      setGalleryFilter('all');
    }
  </script>
</body>
</html>
