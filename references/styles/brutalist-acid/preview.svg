<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <style>
    .mono { font-family: "Courier New", "IBM Plex Mono", Consolas, monospace; }
    .sans { font-family: "Impact", "Arial Black", "Helvetica Neue", "PingFang SC", sans-serif; }
  </style>

  <!-- Pure White Canvas -->
  <rect width="400" height="240" fill="#FFFFFF" rx="8"/>
  <rect width="396" height="236" x="2" y="2" fill="none" stroke="#000000" stroke-width="2.5" rx="7"/>

  <!-- Acid Pink Raw Geometric Polygon -->
  <polygon points="180,0 400,0 400,130 260,100" fill="#FF4591"/>

  <!-- Tier 1: Eyebrow Tape (y: 12..30) -->
  <g transform="translate(18, 12)">
    <rect width="124" height="18" fill="#000000"/>
    <text class="mono" font-size="9" font-weight="900" fill="#00E5CC" x="8" y="13" letter-spacing="1">ACID POSTER // 06</text>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="sans" font-size="18" font-weight="900" fill="#000000" letter-spacing="-0.5" x="0" y="0">先锋撞色海报风</text>
    <text class="mono" font-size="9" font-weight="900" fill="#00E5CC" x="145" y="-2">BRUTALIST POSTER</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <!-- Cyan Offset Shadow -->
    <rect x="5" y="5" width="364" height="118" fill="#00E5CC"/>
    <!-- Black-bordered Box -->
    <rect width="364" height="118" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

    <!-- Left Giant Number -->
    <g transform="translate(16, 16)">
      <text class="sans" font-size="34" font-weight="900" fill="#FF4591" x="0" y="38">RAW</text>
      <text class="mono" font-size="8" font-weight="700" fill="#000000" x="0" y="60">EXHIBITION / 2026</text>
    </g>

    <line x1="126" y1="10" x2="126" y2="108" stroke="#000000" stroke-width="2.5"/>

    <!-- Right Acid Description -->
    <g transform="translate(140, 16)">
      <rect width="124" height="18" fill="#FF4591"/>
      <text class="mono" font-size="8" font-weight="900" fill="#FFFFFF" x="6" y="13">HOT PINK vs CYAN</text>

      <text class="sans" font-size="12" font-weight="900" fill="#000000" x="0" y="44">破坏性大字号 · 先锋艺术展</text>
      <text class="mono" font-size="8" font-weight="700" fill="#333333" x="0" y="64">极度紧凑负字距 · 粗野几何色块叠加</text>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="900" fill="#000000" x="0" y="0">STYLE_ID: <tspan fill="#FF4591">brutalist-acid</tspan></text>
    <g transform="translate(268, -8)">
      <rect x="0" y="0" width="14" height="14" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
      <rect x="18" y="0" width="14" height="14" fill="#000000"/>
      <rect x="36" y="0" width="14" height="14" fill="#FF4591" stroke="#000" stroke-width="2"/>
      <rect x="54" y="0" width="14" height="14" fill="#00E5CC" stroke="#000" stroke-width="2"/>
    </g>
  </g>
</svg>
