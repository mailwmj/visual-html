<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Smooth Luminous Dopamine Gradient -->
    <linearGradient id="dop-base-grad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#E86AA7"/>
      <stop offset="35%" stop-color="#6B9DFE"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="dop-pink-glow" cx="0%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#FF52A2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF52A2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dop-cyan-glow" cx="95%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dop-green-glow" cx="75%" cy="95%" r="65%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Stadium Frosted Glass Shadow -->
    <filter id="dop-capsule-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "Fira Code", "IBM Plex Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Arial Rounded MT Bold", "Varela Round", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Luminous Dopamine Background Canvas -->
  <rect width="400" height="240" fill="url(#dop-base-grad)" rx="8"/>
  <rect width="400" height="240" fill="url(#dop-pink-glow)" rx="8"/>
  <rect width="400" height="240" fill="url(#dop-cyan-glow)" rx="8"/>
  <rect width="400" height="240" fill="url(#dop-green-glow)" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1" rx="7"/>

  <!-- Tier 1: Eyebrow Pill (y: 12..30) -->
  <g transform="translate(18, 12)">
    <rect width="168" height="18" rx="9" fill="rgba(255, 255, 255, 0.25)" stroke="rgba(255, 255, 255, 0.50)" stroke-width="1"/>
    <circle cx="10" cy="9" r="3" fill="#FF4081"/>
    <text class="mono" font-size="8" font-weight="800" fill="#FFFFFF" x="18" y="12" letter-spacing="1">08 // SUMMER DOPAMINE</text>
  </g>

  <!-- Tier 2: Header Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="sans" font-size="16" font-weight="900" fill="#FFFFFF" x="0" y="0">夏日多巴胺风</text>
    <text class="mono" font-size="9" font-weight="700" fill="rgba(255, 255, 255, 0.9)" x="110" y="-1">SUMMER DOPAMINE</text>
  </g>

  <!-- Tier 3: Main Component - 3 Stadium Pill Cards (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <!-- Subtitle Lead -->
    <text class="sans" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.9)" x="0" y="6">高饱和渐变网格 · 极致通透毛玻璃拟态</text>

    <!-- The 3 Stadium/Capsule Pill Cards (True Pill Shape rx=34 on height=68) -->
    <g transform="translate(0, 22)">
      <!-- Pill Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="114" height="68" rx="34" fill="rgba(255, 255, 255, 0.22)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1" filter="url(#dop-capsule-shadow)"/>
        <text class="sans" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" x="57" y="36">300<tspan font-size="11" font-weight="700">%</tspan></text>
        <text class="mono" font-size="7" font-weight="700" fill="rgba(255, 255, 255, 0.9)" text-anchor="middle" x="57" y="52" letter-spacing="0.5">ANNUAL GROWTH</text>
      </g>

      <!-- Pill Card 2 -->
      <g transform="translate(125, 0)">
        <rect width="114" height="68" rx="34" fill="rgba(255, 255, 255, 0.22)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1" filter="url(#dop-capsule-shadow)"/>
        <text class="sans" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" x="57" y="36">1.2<tspan font-size="11" font-weight="700">M</tspan></text>
        <text class="mono" font-size="7" font-weight="700" fill="rgba(255, 255, 255, 0.9)" text-anchor="middle" x="57" y="52" letter-spacing="0.5">ACTIVE USERS</text>
      </g>

      <!-- Pill Card 3 -->
      <g transform="translate(250, 0)">
        <rect width="114" height="68" rx="34" fill="rgba(255, 255, 255, 0.22)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1" filter="url(#dop-capsule-shadow)"/>
        <text class="sans" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" x="57" y="36">0.5<tspan font-size="11" font-weight="700">ms</tspan></text>
        <text class="mono" font-size="7" font-weight="700" fill="rgba(255, 255, 255, 0.9)" text-anchor="middle" x="57" y="52" letter-spacing="0.5">LATENCY</text>
      </g>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="700" fill="rgba(255, 255, 255, 0.9)" x="0" y="0">style_id: <tspan fill="#FFFFFF">summer-dopamine</tspan></text>
    <g transform="translate(264, -8)">
      <circle cx="7" cy="7" r="7" fill="#FF52A2" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle cx="25" cy="7" r="7" fill="#6B9DFE" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle cx="43" cy="7" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle cx="61" cy="7" r="7" fill="#34D399" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>
  </g>
</svg>
