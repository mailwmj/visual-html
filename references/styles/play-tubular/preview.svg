<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Halftone Dot Matrix Pattern -->
    <pattern id="pt-dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DDD8CE"/>
    </pattern>
    <pattern id="halftone-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#111111" fill-opacity="0.35"/>
    </pattern>
    <!-- Multi-stop Vibrant Tube Gradient -->
    <linearGradient id="pt-tube-grad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="28%" stop-color="#7928CA"/>
      <stop offset="55%" stop-color="#FF0080"/>
      <stop offset="78%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <filter id="pt-card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7928CA" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "IBM Plex Mono", monospace; }
    .sans { font-family: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Warm Cream Halftone Dot Canvas -->
  <rect width="400" height="240" fill="#FAF8F3" rx="8"/>
  <rect width="400" height="240" fill="url(#pt-dot-grid)" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" rx="7"/>

  <!-- Background 3D Ambient Tube Ribbon Loop -->
  <path d="M 280 0 C 350 40 420 120 370 200 C 340 240 280 250 250 210" fill="none" stroke="url(#pt-tube-grad)" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
  <!-- Tube Halftone Shading Layer -->
  <path d="M 320 40 C 380 90 400 150 365 195" fill="none" stroke="url(#halftone-dots)" stroke-width="12" opacity="0.6"/>

  <!-- Tier 1: Eyebrow (y: 12..30) -->
  <g transform="translate(18, 12)">
    <circle cx="4" cy="9" r="3.5" fill="#2563EB"/>
    <text class="mono" font-size="9" font-weight="800" fill="#2563EB" x="14" y="12" letter-spacing="1">● PLAY TUBULAR // 11</text>
    <line x1="165" y1="9" x2="364" y2="9" stroke="rgba(37, 99, 235, 0.15)" stroke-width="1"/>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="sans" font-size="16" font-weight="900" fill="#111111" x="0" y="0">玩味极客彩管风</text>
    <text class="mono" font-size="9" font-weight="700" fill="#FF5500" x="130" y="-1">PLAY TUBULAR</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <rect width="364" height="120" rx="16" fill="#FFFFFF" stroke="rgba(0, 0, 0, 0.06)" stroke-width="1" filter="url(#pt-card-shadow)"/>
    <rect x="0" y="0" width="364" height="3" fill="url(#pt-tube-grad)" rx="1.5"/>

    <g transform="translate(18, 14)">
      <!-- Row 1: Tag Badge -->
      <rect width="98" height="18" rx="9" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.2)" stroke-width="0.75"/>
      <text class="mono" font-size="8" font-weight="800" fill="#2563EB" x="8" y="12">✦ AI INNOVATION</text>

      <!-- Row 2: Headline -->
      <text class="sans" font-size="13" font-weight="900" fill="#111111" x="0" y="40">3D 渐变立体彩管 · 半调网点光影</text>
      
      <!-- Row 3: Subtitle -->
      <text class="sans" font-size="9" font-weight="600" fill="#666664" x="0" y="58">浅暖米白点阵画布 · 现代工程粗黑体与弹簧动效</text>

      <!-- Row 4: Halftone Indicator Widget -->
      <g transform="translate(0, 74)">
        <rect width="112" height="18" rx="9" fill="url(#pt-tube-grad)"/>
        <text class="mono" font-size="7" font-weight="800" fill="#FFFFFF" x="10" y="12">HALFTONE RASTER</text>

        <circle cx="132" cy="9" r="6" fill="#FF5500"/>
        <circle cx="148" cy="9" r="6" fill="#FFD600"/>
      </g>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="700" fill="#7E7E7A" x="0" y="0">style_id: <tspan fill="#111111">play-tubular</tspan></text>
    <g transform="translate(245, -8)">
      <circle cx="7" cy="7" r="7" fill="#FAF8F3" stroke="rgba(0,0,0,0.15)"/>
      <circle cx="23" cy="7" r="7" fill="#FFFFFF" stroke="rgba(0,0,0,0.15)"/>
      <circle cx="39" cy="7" r="7" fill="#2563EB"/>
      <circle cx="55" cy="7" r="7" fill="#FF0080"/>
      <circle cx="71" cy="7" r="7" fill="#FF5500"/>
      <circle cx="87" cy="7" r="7" fill="#FFD600"/>
    </g>
  </g>
</svg>
