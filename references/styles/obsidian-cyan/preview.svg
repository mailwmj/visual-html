<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <!-- Dark Aurora Gradient -->
    <radialGradient id="obs-aurora" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obs-card-glow" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "IBM Plex Mono", "SF Mono", Consolas, monospace; }
    .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="400" height="240" fill="#0B0E14" rx="8"/>
  <rect width="400" height="240" fill="url(#obs-aurora)" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="7"/>

  <!-- Tier 1: Eyebrow (y: 12..30) -->
  <g transform="translate(18, 12)">
    <circle cx="4" cy="9" r="3" fill="#38BDF8" filter="url(#cyan-glow)"/>
    <text class="mono" font-size="9" font-weight="700" fill="#38BDF8" x="14" y="12" letter-spacing="1.2">OBSIDIAN CYAN // 03</text>
    <line x1="160" y1="9" x2="364" y2="9" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="sans" font-size="16" font-weight="800" fill="#FFFFFF" x="0" y="0">黑曜霓蓝展厅风</text>
    <text class="mono" font-size="9" font-weight="500" fill="#64748B" x="128" y="-1">OBSIDIAN CYAN</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <rect width="364" height="120" rx="12" fill="#131924" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1"/>
    <rect x="0" y="0" width="364" height="2" fill="url(#obs-card-glow)" rx="1"/>

    <!-- Left: Step Flow Badge (y: 16..46) -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#38BDF8"/>
      <text class="mono" font-size="10" font-weight="800" fill="#0B0E14" text-anchor="middle" x="10" y="14">1</text>
      
      <text class="sans" font-size="12" font-weight="700" fill="#FFFFFF" x="28" y="14">UI/UX 案例展示与设备解构</text>
      <text class="sans" font-size="9" font-weight="400" fill="#94A3B8" x="28" y="32">黑曜深色底 · 电光霓蓝信号通道 · 发光标注引线</text>
    </g>

    <!-- Right: Mini Callout Pin Visualization (y: 68..104) -->
    <g transform="translate(18, 68)">
      <rect width="328" height="36" rx="6" fill="#1A2232" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      
      <!-- Callout Pin 1 -->
      <circle cx="36" cy="18" r="4" fill="#0B0E14" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="36" cy="18" r="2" fill="#38BDF8" filter="url(#cyan-glow)"/>
      <line x1="36" y1="12" x2="36" y2="5" stroke="#38BDF8" stroke-width="1"/>
      <text class="mono" font-size="7" font-weight="600" fill="#38BDF8" x="46" y="21">PIN // 01 ACCEL</text>

      <!-- Metric badge on right -->
      <rect x="232" y="8" width="86" height="20" rx="4" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="0.8"/>
      <text class="mono" font-size="9" font-weight="700" fill="#38BDF8" x="242" y="22">⚡ 99.4% HIT</text>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="600" fill="#526071" x="0" y="0">style_id: <tspan fill="#94A3B8">obsidian-cyan</tspan></text>
    <g transform="translate(268, -8)">
      <circle cx="7" cy="7" r="7" fill="#0B0E14" stroke="rgba(255, 255, 255, 0.2)"/>
      <circle cx="25" cy="7" r="7" fill="#131924" stroke="rgba(56, 189, 248, 0.4)"/>
      <circle cx="43" cy="7" r="7" fill="#38BDF8"/>
      <circle cx="61" cy="7" r="7" fill="#0EA5E9"/>
    </g>
  </g>
</svg>
