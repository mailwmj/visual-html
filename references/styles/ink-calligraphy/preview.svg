<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <style>
    .mono { font-family: "IBM Plex Mono", "JetBrains Mono", Consolas, monospace; }
    .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif; }
    .calli { font-family: "Ma Shan Zheng", "Long Cang", "STKaiti", "KaiTi", serif; }
    .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif; }
  </style>

  <!-- Background Xuan Paper Canvas -->
  <rect width="400" height="240" fill="#F5F2EB" rx="8" />

  <!-- Authentic Master Calligraphy Background Asset Image -->
  <image href="assets/calligraphy-bg.jpg" x="0" y="0" width="400" height="240" preserveAspectRatio="xMidYMid slice" opacity="0.95" />

  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(20, 19, 18, 0.12)" stroke-width="1" rx="7" />

  <!-- Tier 1: Eyebrow (y: 14) -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="16" height="16" rx="2.5" fill="#C23531" />
    <text class="calli" x="8" y="11.5" fill="#FAF7F0" font-size="10" text-anchor="middle" font-weight="700">墨</text>
    <text class="mono" x="24" y="11.5" fill="#C23531" font-size="8.5" font-weight="700" letter-spacing="1.5">INK CALLIGRAPHY // 宣纸泼墨挥毫</text>
  </g>

  <!-- Tier 2: Title (baseline: 56) -->
  <g transform="translate(18, 56)">
    <text class="calli" x="0" y="0" fill="#141312" font-size="20" font-weight="400" letter-spacing="0.5">笔墨气韵 · 宣纸泼墨万象生</text>
  </g>

  <!-- Tier 3: Main Carrier Card (y: 72, height: 124) -->
  <g transform="translate(18, 72)">
    <!-- Base Tray Frame -->
    <rect width="364" height="124" rx="8" fill="rgba(255,253,248,0.96)" stroke="rgba(20,19,18,0.12)" stroke-width="1" />
    
    <!-- 3 Stat Blocks -->
    <rect x="14" y="12" width="104" height="46" rx="4" fill="#F0EBE0" stroke="rgba(20,19,18,0.08)" stroke-width="1" />
    <text class="serif" x="24" y="38" fill="#141312" font-size="19" font-weight="900">5<tspan font-size="11" fill="#C23531" font-weight="700">千年</tspan></text>
    <text class="mono" x="24" y="49" fill="#7E7972" font-size="6" font-weight="600" letter-spacing="0.6">EVOLUTION</text>

    <rect x="128" y="12" width="104" height="46" rx="4" fill="#F0EBE0" stroke="rgba(20,19,18,0.08)" stroke-width="1" />
    <text class="serif" x="138" y="38" fill="#141312" font-size="19" font-weight="900">100<tspan font-size="11" fill="#C23531" font-weight="700">%</tspan></text>
    <text class="mono" x="138" y="49" fill="#7E7972" font-size="6" font-weight="600" letter-spacing="0.6">RAW XUAN</text>

    <rect x="242" y="12" width="108" height="46" rx="4" fill="#F0EBE0" stroke="rgba(20,19,18,0.08)" stroke-width="1" />
    <text class="serif" x="252" y="38" fill="#141312" font-size="19" font-weight="900">18<tspan font-size="11" fill="#C23531" font-weight="700">式</tspan></text>
    <text class="mono" x="252" y="49" fill="#7E7972" font-size="6" font-weight="600" letter-spacing="0.6">SEMANTICS</text>

    <!-- Narrative Feature Frame -->
    <rect x="14" y="66" width="336" height="46" rx="4" fill="#F7F4EE" stroke="rgba(20,19,18,0.06)" stroke-width="1" />
    <rect x="14" y="66" width="3" height="46" rx="1.5" fill="#C23531" />
    <text class="serif" x="26" y="85" fill="#141312" font-size="9.5" font-weight="700">真迹书法飞白背景与 WebGL 动态水墨</text>
    <text class="sans" x="26" y="99" fill="#524E48" font-size="8">古法生宣粗粝质感 · 墨分五色阶梯 · 朱砂篆刻印章点睛</text>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" x="0" y="0" fill="#7E7972" font-size="8" letter-spacing="1">STYLE: INK-CALLIGRAPHY // 宣纸泼墨挥毫风</text>
    <text class="mono" x="364" y="0" fill="#C23531" font-size="8" text-anchor="end" font-weight="600">ORIENTAL CALLIGRAPHY</text>
  </g>
</svg>
