<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <!-- Pixel Dot Background -->
    <pattern id="pixel-dot" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#FFFFFF" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: "Press Start 2P", "IBM Plex Mono", Consolas, monospace; }
    .sans { font-family: "Varela Round", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Blue Pop Base Canvas -->
  <rect width="400" height="240" fill="#0b45f3" rx="8"/>
  <rect width="400" height="240" fill="url(#pixel-dot)" rx="8"/>

  <!-- Cream Canvas Board Background -->
  <rect x="19" y="15" width="368" height="214" rx="8" fill="#111111"/>
  <rect x="14" y="10" width="368" height="214" rx="8" fill="#fcf9f2" stroke="#111111" stroke-width="2.5"/>

  <!-- Tier 1: Eyebrow Tag (y: 12..30) -->
  <g transform="translate(24, 18) rotate(-3)">
    <rect width="114" height="18" rx="3" fill="#ffde00" stroke="#111111" stroke-width="1.5"/>
    <text class="sans" font-size="8" font-weight="900" fill="#111111" x="8" y="13">★ PIXEL POP // 05</text>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(24, 58)">
    <text class="sans" font-size="15" font-weight="900" fill="#111111" x="0" y="0">手绘像素波普风</text>
    <text class="sans" font-size="9" font-weight="800" fill="#0b45f3" x="120" y="-1">PIXEL POP</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(24, 72)">
    <!-- Pink Offset Shadow -->
    <rect x="4" y="4" width="348" height="112" rx="6" fill="#f76a9f"/>
    <!-- White Card Base -->
    <rect width="348" height="112" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"/>

    <!-- Pixel Number Badge -->
    <g transform="translate(12, 12)">
      <rect width="26" height="26" rx="4" fill="#19d15e" stroke="#111111" stroke-width="2"/>
      <text class="sans" font-size="12" font-weight="900" fill="#111111" text-anchor="middle" x="13" y="18">01</text>
    </g>

    <!-- Content -->
    <g transform="translate(48, 14)">
      <text class="sans" font-size="12" font-weight="900" fill="#111111" x="0" y="14">日系青春校园 · 放学后可尔必思</text>
      <text class="sans" font-size="9" font-weight="700" fill="#555555" x="0" y="34">奶油看板隔离底色 · 像素与蜡笔微倾角标</text>
      
      <!-- Pop Tags -->
      <g transform="translate(0, 48)">
        <rect width="56" height="18" rx="3" fill="#ffde00" stroke="#111111" stroke-width="1.5"/>
        <text class="sans" font-size="8" font-weight="900" fill="#111111" x="6" y="12">#高能量</text>

        <rect x="64" width="64" height="18" rx="3" fill="#43c2f0" stroke="#111111" stroke-width="1.5"/>
        <text class="sans" font-size="8" font-weight="900" fill="#111111" x="70" y="12">#波普拼贴</text>
      </g>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 218) -->
  <g transform="translate(24, 218)">
    <text class="sans" font-size="8" font-weight="800" fill="#888888" x="0" y="0">style_id: <tspan fill="#111111">pixel-pop</tspan></text>
    <g transform="translate(248, -8)">
      <rect x="0" y="0" width="12" height="12" fill="#0b45f3" stroke="#111" stroke-width="1.5" rx="2"/>
      <rect x="16" y="0" width="12" height="12" fill="#fcf9f2" stroke="#111" stroke-width="1.5" rx="2"/>
      <rect x="32" y="0" width="12" height="12" fill="#19d15e" stroke="#111" stroke-width="1.5" rx="2"/>
      <rect x="48" y="0" width="12" height="12" fill="#f76a9f" stroke="#111" stroke-width="1.5" rx="2"/>
      <rect x="64" y="0" width="12" height="12" fill="#ffde00" stroke="#111" stroke-width="1.5" rx="2"/>
    </g>
  </g>
</svg>
