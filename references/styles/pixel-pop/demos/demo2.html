<!DOCTYPE html>
<html>
<head>
<title>Demo 2: Retro Grid + Floating Pixels</title>
<style>
  body {
    background-color: #0055ff; margin: 0; height: 100vh; position: relative; overflow: hidden;
    background-image: 
      linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .pixel-group { position: absolute; }
  /* A small 8-bit cloud or shape made of box shadows */
  .shape-1 {
    width: 32px; height: 32px; background: #00ffff;
    top: 20%; left: 15%;
    box-shadow: 32px 0 0 #00ffff, 64px 0 0 #00ffff, 32px 32px 0 #ffde00, 64px 32px 0 #ffde00;
  }
  .shape-2 {
    width: 32px; height: 32px; background: #ff7b93;
    bottom: 25%; right: 20%;
    box-shadow: -32px 0 0 #ff7b93, -32px -32px 0 #00d26a, 0 -32px 0 #00d26a;
  }
  .shape-3 {
    width: 32px; height: 32px; background: #00d26a;
    top: 15%; right: 10%;
  }
  .title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 3rem; font-weight: bold; text-shadow: 4px 4px 0 #111; text-align:center;}
</style>
</head>
<body>
  <div class="pixel-group shape-1"></div>
  <div class="pixel-group shape-2"></div>
  <div class="pixel-group shape-3"></div>
  <div class="title">Demo 2: Retro Grid<br><span style="font-size:1.2rem;color:#ffde00;text-shadow:2px 2px 0 #111;">网格底纹 + 散落的实体像素积木，街机感更强</span></div>
</body>
</html>
