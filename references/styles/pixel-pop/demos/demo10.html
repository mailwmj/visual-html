<!DOCTYPE html>
<html>
<head>
<title>Demo D: 8-bit Frame</title>
<style>
  body { 
    background-color: #0b45f3; margin: 0; position: relative; font-family: sans-serif; color: white; overflow-x: hidden;
  }
  .global-dots {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -3;
    background-image: radial-gradient(rgba(255,255,255,0.4) 2px, transparent 2.5px);
    background-size: 30px 30px;
  }
  
  /* Left Green Pixel Edge */
  .pixel-edge-left {
    position: fixed; top: 0; left: 0; width: 15vw; height: 100vh; z-index: -2;
    background-color: #19d15e;
    mask-image: url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' viewBox='0 0 100 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,0 L100,0 L100,50 L80,50 L80,150 L60,150 L60,300 L100,300 L100,450 L70,450 L70,600 L90,600 L90,800 L50,800 L50,950 L100,950 L100,1000 L0,1000 Z' fill='black'/%3E%3C/svg%3E");
    -webkit-mask-image: url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' viewBox='0 0 100 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,0 L100,0 L100,50 L80,50 L80,150 L60,150 L60,300 L100,300 L100,450 L70,450 L70,600 L90,600 L90,800 L50,800 L50,950 L100,950 L100,1000 L0,1000 Z' fill='black'/%3E%3C/svg%3E");
    mask-size: 100% 100%;
  }

  /* Right Pink Pixel Edge */
  .pixel-edge-right {
    position: fixed; top: 0; right: 0; width: 15vw; height: 100vh; z-index: -2;
    background-color: #f76a9f;
    mask-image: url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' viewBox='0 0 100 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M100,0 L0,0 L0,100 L20,100 L20,250 L40,250 L40,400 L10,400 L10,600 L30,600 L30,750 L0,750 L0,900 L25,900 L25,1000 L100,1000 Z' fill='black'/%3E%3C/svg%3E");
    -webkit-mask-image: url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' viewBox='0 0 100 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M100,0 L0,0 L0,100 L20,100 L20,250 L40,250 L40,400 L10,400 L10,600 L30,600 L30,750 L0,750 L0,900 L25,900 L25,1000 L100,1000 Z' fill='black'/%3E%3C/svg%3E");
    mask-size: 100% 100%;
  }

  .content { max-width: 700px; margin: 40px auto; padding: 40px; min-height: 150vh; }
  .title { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; text-shadow: 3px 3px 0 #111;}
  .text-block { background: #fcf9f2; color: #111; border: 4px solid #111; padding: 20px; margin-bottom: 20px; box-shadow: 6px 6px 0 #111; font-size: 1.1rem; line-height: 1.6;}
</style>
</head>
<body>
  <div class="global-dots"></div>
  <div class="pixel-edge-left"></div>
  <div class="pixel-edge-right"></div>
  
  <div class="content">
    <div class="title">方案 D: 像素夹击画框<br>(8-bit Frame)</div>
    <div class="text-block">放弃全局大面积的复杂图案。</div>
    <div class="text-block">保留最经典的“亮蓝+白点”作为主干。仅在浏览器的最左和最右两侧，贴上极其硬核的“绿色/粉色像素悬崖”。</div>
    <div class="text-block">这样一来，波普的色彩和 8-bit 的元素都得到了强烈的展现，但中间的正文区域完全干净，没有任何视觉冲突。</div>
    <div class="text-block">（请向下滚动感受框景效果）</div>
  </div>
</body>
</html>
