<!DOCTYPE html>
<html>
<head>
<title>Demo A: Comic Halftone Burst</title>
<style>
  body { 
    background-color: #0055ff; margin: 0; height: 100vh; position: relative; overflow: hidden; 
  }
  /* Comic book style halftone that fades out smoothly, no rigid overlapping blocks */
  .halftone-burst {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at center, #00ffff 2px, transparent 2.5px);
    background-size: 24px 24px;
    mask-image: radial-gradient(circle at 50% 30%, black 10%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, black 10%, transparent 80%);
  }
  .halftone-bottom {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 40vh;
    background-image: radial-gradient(circle at center, rgba(255,255,255,0.3) 3px, transparent 3.5px);
    background-size: 16px 16px;
    mask-image: linear-gradient(to top, black 0%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
  }
  .title { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 3rem; font-weight: bold; text-shadow: 4px 4px 0 #111; text-align: center; }
  .desc { font-size: 1.2rem; color: #00ffff; text-shadow: 2px 2px 0 #111; display: block; margin-top: 10px; }
</style>
</head>
<body>
  <div class="halftone-burst"></div>
  <div class="halftone-bottom"></div>
  <div class="title">方案 A: 漫画半调放射<br><span class="desc">利用遮罩实现圆点阵列的平滑渐隐，极具日系波普漫画感，彻底杜绝生硬重叠</span></div>
</body>
</html>
