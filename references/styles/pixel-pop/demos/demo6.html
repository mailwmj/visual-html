<!DOCTYPE html>
<html>
<head>
<title>Demo C: Y2K Distorted Checkerboard</title>
<style>
  body { 
    background-color: #0055ff; margin: 0; height: 100vh; position: relative; overflow: hidden; 
    /* Perspective warping effect for Y2K vibe */
    perspective: 800px;
  }
  .checkers {
    position: absolute; bottom: -30%; left: -50%; width: 200%; height: 100%;
    background-image: 
      linear-gradient(45deg, rgba(0,255,255,0.15) 25%, transparent 25%, transparent 75%, rgba(0,255,255,0.15) 75%, rgba(0,255,255,0.15)),
      linear-gradient(45deg, rgba(0,255,255,0.15) 25%, transparent 25%, transparent 75%, rgba(0,255,255,0.15) 75%, rgba(0,255,255,0.15));
    background-size: 64px 64px;
    background-position: 0 0, 32px 32px;
    transform: rotateX(60deg);
    mask-image: linear-gradient(to top, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, black 40%, transparent 100%);
  }
  .dots-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 60%;
    background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
    background-size: 24px 24px;
    mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
  }
  
  .title { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 3rem; font-weight: bold; text-shadow: 4px 4px 0 #111; text-align: center; z-index: 10; }
  .desc { font-size: 1.2rem; color: #00ffff; text-shadow: 2px 2px 0 #111; display: block; margin-top: 10px; }
</style>
</head>
<body>
  <div class="dots-top"></div>
  <div class="checkers"></div>
  <div class="title">方案 C: Y2K 透视棋盘<br><span class="desc">底部采用 3D 透视棋盘格，顶部为渐隐波点，空间感强且完美衔接</span></div>
</body>
</html>
