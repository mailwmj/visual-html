<!DOCTYPE html>
<html>
<head>
<title>Demo B: Sticker-bomb Graphic Canvas</title>
<style>
  body { 
    background-color: #0055ff; margin: 0; height: 100vh; position: relative; overflow: hidden; 
  }
  /* No uniform grid, instead random floating pop graphics */
  .doodle { position: absolute; opacity: 0.2; }
  .d1 { top: 10%; left: 10%; width: 100px; height: 100px; background: #00ffff; border-radius: 50%; }
  .d2 { bottom: 20%; right: 15%; width: 150px; height: 30px; background: #ffde00; transform: rotate(-15deg); }
  .d3 { top: 30%; right: 5%; width: 80px; height: 80px; background: transparent; border: 15px solid #ff7b93; border-radius: 50%; }
  .d4 { bottom: 10%; left: 20%; width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-bottom: 86px solid #00d26a; transform: rotate(25deg); }
  .d5 { top: 50%; left: 50%; width: 200px; height: 200px; background: repeating-linear-gradient(45deg, rgba(255,255,255,0.2) 0, rgba(255,255,255,0.2) 10px, transparent 10px, transparent 20px); border-radius: 20px; transform: translate(-50%, -50%) rotate(10deg); }
  
  .title { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 3rem; font-weight: bold; text-shadow: 4px 4px 0 #111; text-align: center; }
  .desc { font-size: 1.2rem; color: #ffde00; text-shadow: 2px 2px 0 #111; display: block; margin-top: 10px; }
</style>
</head>
<body>
  <div class="doodle d1"></div><div class="doodle d2"></div><div class="doodle d3"></div><div class="doodle d4"></div><div class="doodle d5"></div>
  <div class="title">方案 B: 涂鸦散落画布<br><span class="desc">放弃死板的全局波点，改为零星散落的几何色块，呈现纯正原宿拼贴感</span></div>
</body>
</html>
