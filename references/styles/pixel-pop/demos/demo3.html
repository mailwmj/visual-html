<!DOCTYPE html>
<html>
<head>
<title>Demo 3: Dynamic Pixel Splitting</title>
<style>
  body { background-color: #0055ff; margin: 0; height: 100vh; position: relative; overflow: hidden; }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.3) 2px, transparent 2px);
    background-size: 24px 24px;
  }
  /* Pixelated zigzag overlay */
  .zigzag {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 40vh;
    background-color: #00d26a;
    clip-path: polygon(
      0% 20%, 5% 20%, 5% 15%, 10% 15%, 10% 10%, 15% 10%, 15% 5%, 20% 5%, 20% 0%, 25% 0%, 25% 5%, 30% 5%, 30% 10%, 35% 10%, 35% 15%, 40% 15%, 40% 20%, 45% 20%, 45% 25%, 50% 25%, 50% 30%, 55% 30%, 55% 25%, 60% 25%, 60% 20%, 65% 20%, 65% 15%, 70% 15%, 70% 10%, 75% 10%, 75% 5%, 80% 5%, 80% 0%, 85% 0%, 85% 5%, 90% 5%, 90% 10%, 95% 10%, 95% 15%, 100% 15%, 
      100% 100%, 0% 100%
    );
  }
  .title { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; font-size: 3rem; font-weight: bold; text-shadow: 4px 4px 0 #111; text-align:center;}
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="zigzag"></div>
  <div class="title">Demo 3: Pixel Split<br><span style="font-size:1.2rem;color:#00d26a;text-shadow:2px 2px 0 #111;">利用像素化切割的撞色地形，视觉冲击力强</span></div>
</body>
</html>
