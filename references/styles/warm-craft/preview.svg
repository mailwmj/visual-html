<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <!-- Paper Shadow -->
    <filter id="sticker-shadow-1" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#323D24" flood-opacity="0.08"/>
    </filter>
    <filter id="sticker-shadow-2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#323D24" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "IBM Plex Mono", "SF Mono", Consolas, monospace; }
    .serif { font-family: "Newsreader", "Playfair Display", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif; }
    .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Warm Oatmeal Paper Canvas -->
  <rect width="400" height="240" fill="#F7F4EC" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(50, 61, 36, 0.12)" stroke-width="1" rx="7"/>

  <!-- Tier 1: Eyebrow (y: 12..30) -->
  <g transform="translate(18, 12)">
    <circle cx="4" cy="9" r="3" fill="#323D24"/>
    <text class="mono" font-size="9" font-weight="700" fill="#323D24" x="14" y="12" letter-spacing="1.2">✦ WARM CRAFT // 09</text>
    <line x1="160" y1="9" x2="364" y2="9" stroke="rgba(50, 61, 36, 0.15)" stroke-width="1"/>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="serif" font-size="17" font-weight="800" fill="#1E231B" x="0" y="0">暖纸手作 / 温润社论风</text>
    <text class="mono" font-size="8" font-weight="600" fill="#8E9685" x="175" y="-1">WARM CRAFT</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <!-- Base Tray Frame -->
    <rect width="364" height="120" rx="10" fill="#FAF8F2" stroke="rgba(50, 61, 36, 0.08)" stroke-width="1"/>

    <!-- Left Tilted Pastel Yellow Sticker (-2deg) -->
    <g transform="translate(14, 14) rotate(-2)">
      <rect width="102" height="90" rx="8" fill="#FFF2BD" stroke="rgba(254, 219, 113, 0.6)" stroke-width="1" filter="url(#sticker-shadow-1)"/>
      <rect x="10" y="10" width="34" height="14" rx="3" fill="#FEDB71"/>
      <text class="mono" font-size="7" font-weight="700" fill="#5A3E00" x="14" y="20">便签 01</text>
      <text class="serif" font-size="11" font-weight="700" fill="#1E231B" x="10" y="44">人文宋体</text>
      <text class="sans" font-size="8" font-weight="500" fill="#565E50" x="10" y="62">书籍排版质感</text>
    </g>

    <!-- Center White/Olive Selected Sticker (Elevated) -->
    <g transform="translate(128, 8)">
      <rect width="108" height="98" rx="8" fill="#FFFFFF" stroke="rgba(50, 61, 36, 0.15)" stroke-width="1" filter="url(#sticker-shadow-2)"/>
      
      <!-- Deep Forest Olive Action Badge -->
      <rect x="10" y="10" width="48" height="16" rx="4" fill="#323D24"/>
      <text class="mono" font-size="7" font-weight="700" fill="#FFFFFF" x="16" y="21">核心智序</text>

      <text class="serif" font-size="12" font-weight="800" fill="#1E231B" x="10" y="46">温润匠心感</text>
      <text class="sans" font-size="8" font-weight="500" fill="#565E50" x="10" y="64">零生硬黑边</text>
      
      <!-- Forest Green CTA Mini Button -->
      <rect x="10" y="74" width="88" height="15" rx="3" fill="#EBF0E4"/>
      <text class="sans" font-size="7" font-weight="700" fill="#323D24" x="22" y="85">智能代理 · 调研</text>
    </g>

    <!-- Right Tilted Soft Matcha Sticker (+2deg) -->
    <g transform="translate(248, 14) rotate(2)">
      <rect width="102" height="90" rx="8" fill="#EEF6DE" stroke="rgba(183, 217, 122, 0.6)" stroke-width="1" filter="url(#sticker-shadow-1)"/>
      <rect x="10" y="10" width="34" height="14" rx="3" fill="#B7D97A"/>
      <text class="mono" font-size="7" font-weight="700" fill="#2B4010" x="14" y="20">贴纸 03</text>
      <text class="serif" font-size="11" font-weight="700" fill="#1E231B" x="10" y="44">弹性动效</text>
      <text class="sans" font-size="8" font-weight="500" fill="#565E50" x="10" y="62">扇形镜像外展</text>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="600" fill="#8E9685" x="0" y="0">style_id: <tspan fill="#323D24">warm-craft</tspan></text>
    <g transform="translate(260, -8)">
      <circle cx="7" cy="7" r="7" fill="#F7F4EC" stroke="rgba(50, 61, 36, 0.2)"/>
      <circle cx="23" cy="7" r="7" fill="#323D24"/>
      <circle cx="39" cy="7" r="7" fill="#FEDB71"/>
      <circle cx="55" cy="7" r="7" fill="#B7D97A"/>
      <circle cx="71" cy="7" r="7" fill="#FFA963"/>
    </g>
  </g>
</svg>
