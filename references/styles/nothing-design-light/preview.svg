<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Dot Matrix Pattern (Subtle delicate dots on white) -->
    <pattern id="dot-matrix-light" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.75" fill="#000000" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="nothing-light-card-grad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#F4F4F4"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "Space Mono", "IBM Plex Mono", "SF Mono", Consolas, monospace; }
    .sans { font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="400" height="240" fill="#FFFFFF" rx="8"/>
  <rect width="400" height="240" fill="url(#dot-matrix-light)" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="#E5E5E5" stroke-width="1" rx="7"/>

  <!-- Tier 1: Eyebrow Tag (y: 12..30) -->
  <g transform="translate(18, 12)">
    <circle cx="4" cy="10" r="3" fill="#D71921"/>
    <text class="mono" font-size="9" font-weight="700" fill="#666666" x="14" y="13" letter-spacing="1.2">● NOTHING // 13</text>
    <text class="mono" font-size="8" font-weight="500" fill="#888888" x="250" y="13">[ LIGHT TECHNICAL REPORT ]</text>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="sans" font-size="16" font-weight="700" fill="#000000" x="0" y="0">Nothing 极简点阵亮白风</text>
    <text class="mono" font-size="9" font-weight="500" fill="#777777" x="194" y="-1">NOTHING LIGHT</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <!-- Card Base -->
    <rect width="364" height="120" fill="url(#nothing-light-card-grad)" stroke="#E0E0E0" stroke-width="1" rx="6"/>
    
    <!-- Top Status Row -->
    <circle cx="14" cy="16" r="2.5" fill="#D71921"/>
    <text class="mono" font-size="8" font-weight="600" fill="#666666" x="22" y="19" letter-spacing="0.6">01 // EXECUTIVE SUMMARY</text>
    
    <!-- Status Pill Badges -->
    <rect x="238" y="9" width="62" height="14" fill="#16A34A" fill-opacity="0.1" stroke="#16A34A" stroke-opacity="0.4" rx="999"/>
    <text class="mono" font-size="7" font-weight="700" fill="#16A34A" x="245" y="19">NOMINAL</text>

    <rect x="306" y="9" width="50" height="14" fill="#D71921" fill-opacity="0.1" stroke="#D71921" stroke-opacity="0.4" rx="999"/>
    <text class="mono" font-size="7" font-weight="700" fill="#D71921" x="312" y="19">CRITICAL</text>

    <!-- Left Main Stat: 99.8% -->
    <g transform="translate(16, 36)">
      <text class="mono" font-size="7" font-weight="700" fill="#888888" x="0" y="6">ACCURACY BENCHMARK</text>
      <text class="mono" font-size="28" font-weight="800" fill="#000000" x="0" y="36">99.8<tspan font-size="14" fill="#D71921">%</tspan></text>
      <text class="mono" font-size="6.5" font-weight="500" fill="#666666" x="0" y="52">ZERO INFERENCE DRIFT</text>
      
      <!-- Segmented Meter (Black + Coral) -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="10" height="4" fill="#000000" rx="0.5"/>
        <rect x="12" y="0" width="10" height="4" fill="#000000" rx="0.5"/>
        <rect x="24" y="0" width="10" height="4" fill="#000000" rx="0.5"/>
        <rect x="36" y="0" width="10" height="4" fill="#000000" rx="0.5"/>
        <rect x="48" y="0" width="10" height="4" fill="#000000" rx="0.5"/>
        <rect x="60" y="0" width="10" height="4" fill="#D71921" rx="0.5"/>
        <rect x="72" y="0" width="10" height="4" fill="#D71921" rx="0.5"/>
        <rect x="84" y="0" width="10" height="4" fill="#D71921" rx="0.5"/>
        <rect x="96" y="0" width="10" height="4" fill="#E2E2E2" rx="0.5"/>
        <rect x="108" y="0" width="10" height="4" fill="#E2E2E2" rx="0.5"/>
      </g>
    </g>

    <!-- Right Column: Secondary Specs (Latency & Capacity) -->
    <g transform="translate(186, 36)">
      <!-- Spec 1: Latency (Amber) -->
      <text class="mono" font-size="6.5" font-weight="600" fill="#666666" x="0" y="6">PIPELINE LATENCY</text>
      <text class="mono" font-size="14" font-weight="700" fill="#000000" x="0" y="22">0.42<tspan font-size="9" fill="#D97706">ms</tspan></text>
      
      <!-- Amber Segmented Meter -->
      <g transform="translate(0, 27)">
        <rect x="0" y="0" width="8" height="3" fill="#D97706" rx="0.5"/>
        <rect x="10" y="0" width="8" height="3" fill="#D97706" rx="0.5"/>
        <rect x="20" y="0" width="8" height="3" fill="#D97706" rx="0.5"/>
        <rect x="30" y="0" width="8" height="3" fill="#000000" rx="0.5"/>
        <rect x="40" y="0" width="8" height="3" fill="#E2E2E2" rx="0.5"/>
        <rect x="50" y="0" width="8" height="3" fill="#E2E2E2" rx="0.5"/>
        <rect x="60" y="0" width="8" height="3" fill="#E2E2E2" rx="0.5"/>
        <rect x="70" y="0" width="8" height="3" fill="#E2E2E2" rx="0.5"/>
      </g>

      <!-- Spec 2: Capacity (Green) -->
      <text class="mono" font-size="6.5" font-weight="600" fill="#666666" x="90" y="6">ACTIVE CAPACITY</text>
      <text class="mono" font-size="14" font-weight="700" fill="#000000" x="90" y="22">1.28<tspan font-size="9" fill="#16A34A">M</tspan></text>
      
      <!-- Green Segmented Meter -->
      <g transform="translate(90, 27)">
        <rect x="0" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="10" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="20" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="30" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="40" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="50" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="60" y="0" width="8" height="3" fill="#16A34A" rx="0.5"/>
        <rect x="70" y="0" width="8" height="3" fill="#E2E2E2" rx="0.5"/>
      </g>

      <!-- Technical Spec Row Mini -->
      <rect x="0" y="42" width="164" height="22" fill="#EAEAEA" stroke="#E0E0E0" rx="4"/>
      <text class="mono" font-size="6.5" font-weight="600" fill="#666666" x="8" y="56">ENGINE:</text>
      <text class="mono" font-size="7" font-weight="700" fill="#000000" x="48" y="56">DOTO + GROTESK</text>
      <circle cx="150" cy="53" r="2.5" fill="#D71921"/>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="600" fill="#888888" x="0" y="0">style_id: <tspan fill="#000000">nothing-design-light</tspan></text>
    <g transform="translate(236, -8)">
      <rect x="0" y="0" width="14" height="14" fill="#FFFFFF" stroke="#CCCCCC" rx="2"/>
      <rect x="18" y="0" width="14" height="14" fill="#F4F4F4" stroke="#CCCCCC" rx="2"/>
      <rect x="36" y="0" width="14" height="14" fill="#000000" rx="2"/>
      <rect x="54" y="0" width="14" height="14" fill="#D71921" rx="2"/>
      <rect x="72" y="0" width="14" height="14" fill="#16A34A" rx="2"/>
      <rect x="90" y="0" width="14" height="14" fill="#D97706" rx="2"/>
    </g>
  </g>
</svg>
