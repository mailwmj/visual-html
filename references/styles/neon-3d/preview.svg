<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Top-Right Neon Aurora -->
    <radialGradient id="neon-glow-tr" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-grad-border" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "IBM Plex Mono", "SF Mono", Consolas, monospace; }
    .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <!-- Background Canvas (Pure Pitch Black) -->
  <rect width="400" height="240" fill="#000000" rx="8"/>
  <rect width="400" height="240" fill="url(#neon-glow-tr)" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1" rx="7"/>

  <!-- Tier 1: Eyebrow (y: 12..30) -->
  <g transform="translate(18, 12)">
    <text class="mono" font-size="9" font-weight="700" fill="#A855F7" x="0" y="12" letter-spacing="1.5">❖ NEON AURORA // 04</text>
    <line x1="145" y1="8" x2="364" y2="8" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="sans" font-size="16" font-weight="800" fill="#FFFFFF" x="0" y="0">暗紫流体极光风</text>
    <text class="mono" font-size="9" font-weight="500" fill="#888888" x="135" y="-1">NEON AURORA</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <!-- Base 3D Card -->
    <rect width="364" height="120" rx="14" fill="#0F0F0F" stroke="url(#neon-grad-border)" stroke-width="1.2"/>
    
    <!-- Top-Left Inner Light Beam -->
    <line x1="16" y1="1" x2="160" y2="1" stroke="#A855F7" stroke-width="2" stroke-linecap="round" filter="url(#neon-glow)"/>

    <!-- Left Vertical Light Pillar -->
    <rect x="18" y="24" width="4" height="72" rx="2" fill="#EC4899" filter="url(#neon-glow)"/>

    <!-- Card Content -->
    <g transform="translate(34, 16)">
      <!-- Row 1: Pill Badge -->
      <rect width="96" height="18" rx="9" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="0.8"/>
      <text class="mono" font-size="8" font-weight="700" fill="#E879F9" x="8" y="12">✦ 3D EMBOSSED</text>

      <rect x="238" y="0" width="80" height="18" rx="9" fill="url(#neon-grad-border)"/>
      <text class="sans" font-size="8" font-weight="700" fill="#FFFFFF" x="250" y="12">VAPORWAVE</text>

      <!-- Row 2: Headline -->
      <text class="sans" font-size="13" font-weight="800" fill="#FFFFFF" x="0" y="44">流体极光光晕 · 胶片微粒质感</text>
      
      <!-- Row 3: Subtitle -->
      <text class="sans" font-size="9" font-weight="400" fill="#8E8E93" x="0" y="64">80%+ 纯黑中性底色 · 霓虹紫/洋红高光通道</text>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="600" fill="#666666" x="0" y="0">style_id: <tspan fill="#A855F7">neon-3d</tspan></text>
    <g transform="translate(268, -8)">
      <circle cx="7" cy="7" r="7" fill="#000000" stroke="#333333"/>
      <circle cx="25" cy="7" r="7" fill="#0F0F0F" stroke="#A855F7"/>
      <circle cx="43" cy="7" r="7" fill="#A855F7"/>
      <circle cx="61" cy="7" r="7" fill="#EC4899"/>
    </g>
  </g>
</svg>
