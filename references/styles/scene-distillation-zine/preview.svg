<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Paper Shadow -->
    <filter id="zine-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2B2825" flood-opacity="0.08"/>
    </filter>
    <pattern id="halftone-dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E4870" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: "Courier Prime", "Courier New", "SF Mono", Consolas, monospace; }
    .serif { font-family: "Newsreader", "Playfair Display", "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif; }
    .sans { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  </style>

  <!-- Warm Cotton Paper Canvas -->
  <rect width="400" height="240" fill="#F5EFEB" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(30, 72, 112, 0.15)" stroke-width="1" rx="7"/>

  <!-- Tier 1: Eyebrow (y: 12..30) -->
  <g transform="translate(18, 12)">
    <rect x="0" y="2" width="126" height="15" rx="3" fill="#1E4870" fill-opacity="0.08" stroke="#1E4870" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="6" cy="9.5" r="2.5" fill="#A84335"/>
    <text class="mono" font-size="8" font-weight="700" fill="#1E4870" x="14" y="12.5" letter-spacing="1">✦ ZINE ISSUE 1.5</text>
    <line x1="140" y1="9.5" x2="364" y2="9.5" stroke="rgba(30, 72, 112, 0.18)" stroke-dasharray="3 3"/>
  </g>

  <!-- Tier 2: Title (y: 44..60, baseline: 58) -->
  <g transform="translate(18, 58)">
    <text class="serif" font-size="17" font-weight="700" fill="#1E4870" x="0" y="0">手作刊物风</text>
    <text class="mono" font-size="8" font-weight="600" fill="#8E887E" x="120" y="-1">SCENE DISTILLATION ZINE</text>
  </g>

  <!-- Tier 3: Main Card (y: 72..192, height: 120) -->
  <g transform="translate(18, 72)">
    <!-- Base Paper Card Tray -->
    <rect width="364" height="120" rx="4" fill="#FAF6EE" stroke="rgba(30, 72, 112, 0.22)" stroke-width="1" filter="url(#zine-shadow)"/>

    <!-- Left Content Column -->
    <g transform="translate(16, 14)">
      <!-- Eyebrow Tag -->
      <text class="mono" font-size="7" font-weight="700" fill="#486E91" letter-spacing="0.8">EDITORIAL PROPOSITION // 01</text>
      
      <!-- Headline -->
      <text class="serif" font-size="14" font-weight="700" fill="#1E4870" x="0" y="24">where stone meets sky.</text>
      
      <!-- Poetic Subtext -->
      <text class="sans" font-size="8.5" fill="#625D56" x="0" y="42">孔版钴青蓝油墨 · 撕纸纤维毛边</text>
      <text class="sans" font-size="8.5" fill="#625D56" x="0" y="55">74% 静谧留白与打字机题记排版</text>

      <!-- Bottom Stamp & Tag Row -->
      <g transform="translate(0, 68)">
        <!-- Cinnabar Mineral Stamp Badge -->
        <rect x="0" y="0" width="84" height="18" rx="2" fill="rgba(168, 67, 53, 0.08)" stroke="#A84335" stroke-width="1"/>
        <text class="mono" font-size="7" font-weight="700" fill="#A84335" x="6" y="12">★ 朱砂印泥点睛</text>

        <!-- Metric Capsule -->
        <rect x="92" y="0" width="76" height="18" rx="2" fill="#E4ECF4" stroke="rgba(30, 72, 112, 0.2)" stroke-width="1"/>
        <text class="mono" font-size="7" font-weight="700" fill="#1E4870" x="98" y="12">18+1 COMPONENTS</text>
      </g>
    </g>

    <!-- Right Visual Collage Panel with Torn Edge & Dome Art -->
    <g transform="translate(224, 8)">
      <!-- Panel BG with Halftone Screen -->
      <rect width="132" height="104" rx="2" fill="#E4ECF4" stroke="rgba(30, 72, 112, 0.25)" stroke-width="1"/>
      <rect width="132" height="104" rx="2" fill="url(#halftone-dots)"/>

      <!-- Torn-Edge Deckle Mask (Simulated polygon) -->
      <path d="M 0,0 L 14,8 L 4,20 L 16,36 L 6,52 L 18,68 L 8,84 L 16,96 L 0,104 Z" fill="#FAF6EE"/>

      <!-- Architectural Dome Line Art & Cross -->
      <g transform="translate(56, 12)" stroke="#1E4870" fill="none" stroke-width="1.2">
        <!-- Cathedral Cross -->
        <line x1="16" y1="2" x2="16" y2="12"/>
        <line x1="12" y1="5" x2="20" y2="5"/>
        <circle cx="16" cy="5" r="1.5" fill="#1E4870"/>

        <!-- Dome Cone -->
        <path d="M 16,12 L 4,38 L 28,38 Z" fill="#FAF6EE" fill-opacity="0.7"/>
        <line x1="16" y1="12" x2="10" y2="38"/>
        <line x1="16" y1="12" x2="22" y2="38"/>

        <!-- Drum Column -->
        <rect x="4" y="38" width="24" height="26" fill="#FAF6EE" fill-opacity="0.7"/>
        <line x1="10" y1="42" x2="10" y2="58"/>
        <line x1="16" y1="42" x2="16" y2="58"/>
        <line x1="22" y1="42" x2="22" y2="58"/>

        <!-- Base roof lines -->
        <path d="M 0,64 L 32,64 L 38,76 L -6,76 Z" fill="#FAF6EE" fill-opacity="0.7"/>
      </g>

      <!-- Plate ID & Orientation -->
      <text class="mono" font-size="6.5" font-weight="700" fill="#1E4870" x="18" y="98">PLATE NO. 04 · TBILISI</text>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 220) -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="600" fill="#8E887E" x="0" y="0">style_id: <tspan fill="#1E4870">scene-distillation-zine</tspan></text>
    <g transform="translate(260, -8)">
      <circle cx="7" cy="7" r="7" fill="#F5EFEB" stroke="rgba(30, 72, 112, 0.2)"/>
      <circle cx="23" cy="7" r="7" fill="#FAF6EE" stroke="rgba(30, 72, 112, 0.2)"/>
      <circle cx="39" cy="7" r="7" fill="#1E4870"/>
      <circle cx="55" cy="7" r="7" fill="#2B2825"/>
      <circle cx="71" cy="7" r="7" fill="#A84335"/>
    </g>
  </g>
</svg>
