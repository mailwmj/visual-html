<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <filter id="bamboo-card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2B4E24" flood-opacity="0.06"/>
    </filter>
    <filter id="bamboo-elevated-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2B4E24" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "IBM Plex Mono", "JetBrains Mono", Consolas, monospace; }
    .serif { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", "Cinzel", serif; }
    .sans { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", -apple-system, sans-serif; }
  </style>

  <!-- Xuan Paper Background -->
  <rect width="400" height="240" fill="#F6F4EE" rx="8"/>
  <rect width="398" height="238" x="1" y="1" fill="none" stroke="rgba(43, 78, 36, 0.12)" stroke-width="1" rx="7"/>

  <!-- Full-Bleed 2750 High-Res Bamboo Background Image across Canvas -->
  <image href="assets/bamboo-bg.jpg" x="0" y="0" width="400" height="240" preserveAspectRatio="xMaxYMid slice" opacity="0.95" image-rendering="optimizeQuality"/>

  <!-- Tier 1: Eyebrow (y: 12..30) [Group Index 0] -->
  <g transform="translate(18, 12)">
    <rect x="0" y="2" width="14" height="14" rx="2" fill="#C03E2D"/>
    <text class="serif" font-size="9" font-weight="900" fill="#FFFFFF" x="3" y="13">印</text>
    <text class="mono" font-size="9" font-weight="700" fill="#2B4E24" x="20" y="13" letter-spacing="1.2">✦ INK BAMBOO // 15</text>
    <line x1="165" y1="9" x2="230" y2="9" stroke="rgba(43, 78, 36, 0.2)" stroke-width="1"/>
  </g>

  <!-- Tier 2: Title (y: 48..64, baseline: 58) [Group Index 1] -->
  <g transform="translate(18, 58)">
    <rect x="75" y="-12" width="42" height="15" rx="3" fill="#E1EED9" fill-opacity="0.85"/>
    <text class="serif" font-size="17" font-weight="800" fill="#1C241B" x="0" y="0">青绿水墨竹韵风</text>
    <text class="mono" font-size="8" font-weight="600" fill="#828E7E" x="146" y="-1">ORIENTAL INK &amp; BAMBOO</text>
  </g>

  <!-- Tier 3: Main Card (y: 66..76, height: 120, y=72) [Group Index 2] -->
  <g transform="translate(18, 72)">
    <!-- Base Tray Frame with Semi-transparent Xuan Paper -->
    <rect width="364" height="120" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="rgba(43, 78, 36, 0.14)" stroke-width="1"/>

    <!-- Left Card: Bamboo Node & Calligraphy (虚心有节) -->
    <g transform="translate(12, 14)">
      <rect width="100" height="92" rx="8" fill="#FFFFFF" stroke="rgba(90, 143, 67, 0.25)" stroke-width="1" filter="url(#bamboo-card-shadow)"/>
      <rect x="8" y="10" width="34" height="14" rx="3" fill="#E1EED9"/>
      <text class="mono" font-size="7" font-weight="700" fill="#2B4E24" x="12" y="20">01 节</text>
      <text class="serif" font-size="11" font-weight="700" fill="#1C241B" x="8" y="44">虚心有节</text>
      <text class="sans" font-size="8" font-weight="500" fill="#4A5646" x="8" y="60">古法宣纸宋体</text>
      <text class="mono" font-size="7" font-weight="600" fill="#828E7E" x="8" y="76">ORIENTAL</text>
    </g>

    <!-- Center Card: Elevated White Xuan with Vermilion Seal (青绿山水) -->
    <g transform="translate(122, 8)">
      <rect width="112" height="98" rx="8" fill="#FFFFFF" stroke="rgba(90, 143, 67, 0.4)" stroke-width="1" filter="url(#bamboo-elevated-shadow)"/>
      
      <!-- Vermilion Seal Badge -->
      <rect x="10" y="10" width="48" height="16" rx="3" fill="#C03E2D"/>
      <text class="mono" font-size="7" font-weight="700" fill="#FFFFFF" x="16" y="21">朱砂点睛</text>

      <text class="serif" font-size="12" font-weight="800" fill="#1C241B" x="10" y="46">青绿水墨竹韵</text>
      <text class="sans" font-size="8" font-weight="500" fill="#4A5646" x="10" y="64">飞白水墨刷纹</text>
      
      <!-- Mini CTA Pill with Bamboo Theme -->
      <rect x="10" y="74" width="92" height="15" rx="3" fill="#E1EED9"/>
      <text class="sans" font-size="7" font-weight="700" fill="#2B4E24" x="20" y="85">东方雅韵 · 研报</text>
    </g>

    <!-- Right Card: Bamboo Leaf & Minimal Texture Preview -->
    <g transform="translate(244, 14)">
      <rect width="108" height="92" rx="8" fill="#F8FAF6" stroke="rgba(43, 78, 36, 0.18)" stroke-width="1" filter="url(#bamboo-card-shadow)"/>
      <rect x="10" y="10" width="36" height="14" rx="3" fill="#EAF2E6"/>
      <text class="mono" font-size="7" font-weight="700" fill="#3C7A68" x="14" y="20">03 韵</text>
      
      <text class="serif" font-size="11" font-weight="700" fill="#1C241B" x="10" y="46">水墨飞白</text>
      <text class="sans" font-size="8" font-weight="500" fill="#4A5646" x="10" y="62">竹叶青翠秀逸</text>
      <text class="mono" font-size="7" font-weight="600" fill="#828E7E" x="10" y="76">INK ART</text>
    </g>
  </g>

  <!-- Tier 4: Footer Meta (y: 205..228, baseline: 220) [Group Index 3] -->
  <g transform="translate(18, 220)">
    <text class="mono" font-size="9" font-weight="600" fill="#828E7E" x="0" y="0">style_id: <tspan fill="#2B4E24" font-weight="700">ink-bamboo</tspan></text>
    <g transform="translate(230, -8)">
      <circle cx="7" cy="7" r="7" fill="#F6F4EE" stroke="rgba(43, 78, 36, 0.2)"/>
      <circle cx="23" cy="7" r="7" fill="#5A8F43"/>
      <circle cx="39" cy="7" r="7" fill="#2B4E24"/>
      <circle cx="55" cy="7" r="7" fill="#C03E2D"/>
      <circle cx="71" cy="7" r="7" fill="#B88B4A"/>
    </g>
  </g>
</svg>